name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld flex bison automake autoconf m4 fakeroot uuid-dev

      - name: Install theos (with Linux toolchain)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Add iPhoneOS16.5 SDK
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks-tmp"
            cd "$THEOS/sdks-tmp"
            git sparse-checkout set iPhoneOS16.5.sdk
            mv iPhoneOS16.5.sdk "$THEOS/sdks/"
            cd "$THEOS" && rm -rf sdks-tmp
          fi
          ls "$THEOS/sdks/" | grep -i "16.5" || (echo "16.5 SDK MISSING" && exit 1)

      - name: Sync device repositories
        run: python3 tools/hakios-device.py sync

      - name: Configure kernel (redwood baseline)
        run: make redwood_defconfig

      - name: Build kernel
        run: |
          [ -d xnu-src/xnu-8796.121.2 ] || xnu/apply.sh
          [ -e xnu-deps/host/bin/ld64 ] || xnu-deps/setup.sh
          # BUILD_DSYM=0: Linux 没有 Apple dsymutil，跳过调试符号包（内核二进制不受影响）
          tools/make-kernel.sh -j4 BUILD_DSYM=0

      - name: Dump build logs on failure
        if: failure()
        run: |
          for f in xnu-deps/*.log; do
            [ -e "$f" ] && echo "=== $f (tail 60) ===" && tail -60 "$f"
          done
          exit 1

      - name: Build placeholder loader
        run: make loader-open

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -v hakios-kernel out/ || true
          cp -v xnuloader/loader.efi out/loader-open.efi || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: hakios-build-redwood
          path: out/
          retention-days: 7
